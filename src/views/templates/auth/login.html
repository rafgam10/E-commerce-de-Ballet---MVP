{% extends "base.html" %}

{% block title %}Entrar - Ballet Boutique{% endblock %}

{% block content %}
<section class="auth-card">
  <div>
    <p class="eyebrow">Bem-vinda de volta</p>
    <h1>Entrar na sua conta</h1>
    <p>Entre para acompanhar pedidos, salvar endereço e finalizar compras.</p>
  </div>
  <form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>E-mail
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Senha
      <input type="password" name="senha" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary">Entrar</button>
    <p>Ainda não tem conta? <a href="{{ url_for('auth.cadastro_usuario') }}">Cadastre-se</a>.</p>
  </form>
</section>
{% endblock %}
