{% extends "base.html" %}

{% block title %}Criar conta - Ballet Boutique{% endblock %}

{% block content %}
<section class="auth-card">
  <div>
    <p class="eyebrow">Primeira compra?</p>
    <h1>Crie sua conta</h1>
    <p>Com uma conta voce pode montar carrinho, finalizar pedido e acompanhar o status.</p>
  </div>
  <form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nome
      <input type="text" name="nome" required autocomplete="name">
    </label>
    <label>E-mail
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Senha
      <input type="password" name="senha" minlength="6" required autocomplete="new-password">
    </label>
    <button type="submit" class="btn btn-primary">Criar conta</button>
    <p>Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a>.</p>
  </form>
</section>
{% endblock %}
